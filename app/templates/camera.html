{% extends "base.html" %}

{% block title %}Mark Attendance{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h3 class="fw-bold">Mark Attendance</h3>
                    <p class="text-muted">Place your face inside the box</p>
                </div>

                <!-- CAMERA -->
                <div class="camera-container">

                    <video id="videoElement" autoplay playsinline muted></video>
                    <canvas id="canvasElement" style="display:none;"></canvas>

                    <!-- FACE BOX -->
                    <div id="faceBox"></div>

                    <!-- LOADER -->
                    <div id="loadingSpinner" class="overlay d-none">
                        <div class="spinner-border text-light"></div>
                    </div>

                    <!-- SUCCESS -->
                    <div id="successOverlay" class="overlay d-none">
                        <div class="success-box">✔</div>
                    </div>

                </div>

                <button id="scanBtn" class="btn btn-success w-100 mt-3">
                    Scan Face
                </button>

                <div id="statusMessage" class="mt-3"></div>

            </div>
        </div>
    </div>
</div>

<style>

/* CAMERA */
.camera-container{
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: black;
    border-radius: 12px;
    overflow: hidden;
}

/* VIDEO */
video{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 🔥 BIG FACE BOX */
#faceBox{
    position: absolute;

    width: 50%;              /* balanced */
    max-width: 300px;

    aspect-ratio: 1/1;

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    border: 3px solid #00ff88;
    border-radius: 16px;

    box-shadow: 0 0 20px rgba(0,255,136,0.6);
}

/* GLOW */
@keyframes glow{
    0%{ box-shadow: 0 0 10px #00ff88;}
    50%{ box-shadow: 0 0 30px #00ff88;}
    100%{ box-shadow: 0 0 10px #00ff88;}
}

/* OVERLAY */
.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background: rgba(0,0,0,0.4);
}

.success-box{
    width:90px;          /* reduced from 150 */
    height:90px;

    background:#00ff88;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:36px;      /* reduced from 60 */
    color:white;
}

</style>

{% endblock %}

{% block scripts %}

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>

// 🔥 INIT EMAILJS
(function(){
    emailjs.init("a-m2gDQmi6spO7CGi"); // 🔁 replace
})();

// START CAMERA
async function startCamera(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({video:true});
        videoElement.srcObject = stream;
    }catch{
        alert("Camera permission denied");
    }
}

// CAPTURE
function captureFace(){
    const video = document.getElementById("videoElement");
    const canvas = document.getElementById("canvasElement");
    const ctx = canvas.getContext("2d");

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const size = Math.min(vw, vh) * 0.5;

    const sx = (vw - size) / 2;
    const sy = (vh - size) / 2;

    canvas.width = 400;
    canvas.height = 400;

    ctx.drawImage(video, sx, sy, size, size, 0, 0, 400, 400);

    return canvas.toDataURL("image/jpeg", 0.9);
}

// UI
function showMsg(msg, type){
    document.getElementById("statusMessage").innerHTML =
    `<div class="alert alert-${type}">${msg}</div>`;
}

let isScanning = false;
let emailSent = false; // 🔥 prevent duplicate email

document.addEventListener("DOMContentLoaded", ()=>{
    startCamera();
});

// SCAN
document.getElementById("scanBtn").addEventListener("click", async ()=>{

    if(isScanning) return;

    isScanning = true;
    scanBtn.disabled = true;

    loadingSpinner.classList.remove("d-none");

    try{

        const img = captureFace();

        const res = await fetch("/api/recognize-face",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({image:img})
        });

        const data = await res.json();

        loadingSpinner.classList.add("d-none");

        if(data.success && data.found && data.status !== "duplicate"){

            successOverlay.classList.remove("d-none");

            showMsg(`Welcome ${data.user_name}`, "success");

            // 🔥 EMAILJS SEND
            if(!emailSent){

                const [date, time] = data.marked_at.split(" ");

                emailjs.send("service_tqrwc73", "template_304mtxa", {
                    name: data.user_name,
                    date: date,
                    time: time,
                    email: data.user_email
                })
                .then(()=>{
                    console.log("✅ Email sent");
                    emailSent = true;
                })
                .catch((err)=>{
                    console.error("❌ Email failed", err);
                });
            }

            setTimeout(()=>{
                successOverlay.classList.add("d-none");
            },2000);

        }
        else if(data.status === "duplicate"){
            showMsg(`${data.user_name} already marked`, "warning");
        }
        else{
            showMsg("Face not recognized", "danger");
        }

    }catch(err){
        loadingSpinner.classList.add("d-none");
        showMsg("Server error", "danger");
    }

    isScanning = false;
    scanBtn.disabled = false;

});

</script>

{% endblock %}
